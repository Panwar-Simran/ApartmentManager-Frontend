<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expenses | ApartmentManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-buildings-fill fs-1 text-primary"></i>
        <h6 class="d-inline ms-2">ApartmentManager</h6>
        <br>
        <small class="text-muted" id="roleLabel">Panel</small>
    </div>
    <nav class="nav flex-column mt-2" id="sidebarNav"></nav>
</div>

<!-- Topbar -->
<div class="topbar">
    <h6 class="page-title">Expenses</h6>
    <div class="user-info">
        <div class="avatar">PR</div>
        <span id="topbarRole">Loading...</span>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <div id="message"></div>

    <!-- Page Header -->
    <div class="page-header d-flex justify-content-between
                align-items-center">
        <div>
            <h5>Expenses</h5>
            <p>Track apartment expenses</p>
        </div>
        <!-- Buttons only for Pradhana -->
        <div id="actionBtnsContainer" class="d-flex gap-2"></div>
    </div>

    <!-- Filter Card -->
    <div class="card mb-3">
        <div class="card-body">
            <div class="row align-items-end g-3">
                <div class="col-md-3">
                    <label class="form-label">Month</label>
                    <select class="form-select" id="filterMonth">
                        <option value="">All Months</option>
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Year</label>
                    <input type="number"
                           class="form-control"
                           id="filterYear"
                           placeholder="e.g. 2026">
                </div>
                <div class="col-md-3">
                    <button class="btn btn-outline-primary"
                            onclick="filterExpenses()">
                        <i class="bi bi-funnel me-1"></i>
                        Filter
                    </button>
                    <button class="btn btn-outline-secondary ms-2"
                            onclick="clearFilter()">
                        Clear
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Expenses Table -->
    <div class="card">
        <div class="card-body p-0">
            <div id="expensesTableContainer">
                <div class="empty-state">
                    <i class="bi bi-receipt text-muted"></i>
                    <p>Loading expenses...</p>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Add Category Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Expense Category</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <div id="categoryModalMessage"></div>

                <form id="addCategoryForm">
                    <div class="mb-3">
                        <label class="form-label">
                            Category Name
                        </label>
                        <input type="text"
                               class="form-control"
                               id="categoryName"
                               placeholder="e.g. Lift Maintenance">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Type</label>
                        <select class="form-select" id="categoryType">
                            <option value="">Select type</option>
                            <option value="RECURRING">Recurring</option>
                            <option value="ONE_TIME">One Time</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Frequency</label>
                        <select class="form-select"
                                id="categoryFrequency">
                            <option value="">Select frequency</option>
                            <option value="MONTHLY">Monthly</option>
                            <option value="YEARLY">Yearly</option>
                            <option value="ONE_TIME">One Time</option>
                        </select>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button"
                        class="btn btn-primary"
                        id="addCategoryBtn"
                        onclick="addCategory()">
                    Add Category
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Add Expense Modal -->
<div class="modal fade" id="addExpenseModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add Expense</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <div id="expenseModalMessage"></div>

                <form id="addExpenseForm">
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select"
                                id="expenseCategoryId">
                            <option value="">Select category</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number"
                               class="form-control"
                               id="expenseAmount"
                               placeholder="Enter amount"
                               min="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <input type="text"
                               class="form-control"
                               id="expenseDescription"
                               placeholder="Brief description">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Expense Date
                        </label>
                        <input type="date"
                               class="form-control"
                               id="expenseDate">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Receipt URL
                            <small class="text-muted">
                                (Optional)
                            </small>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="expenseReceiptUrl"
                               placeholder="Paste receipt URL">
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button"
                        class="btn btn-primary"
                        id="addExpenseBtn"
                        onclick="addExpense()">
                    Add Expense
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/expense.js"></script>

</body>
</html>
