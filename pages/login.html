<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ApartmentManager</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-4">

            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="login-logo mx-auto mb-3">
                    <i class="bi bi-buildings-fill fs-1 text-primary"></i>
                </div>
                <h4 class="fw-bold">ApartmentManager</h4>
                <p class="text-muted small">Gokul Apartment</p>
            </div>

            <!-- Login Card -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">
                    <h5 class="card-title mb-4">Sign in</h5>

                    <!-- Message div -->
                    <div id="message"></div>

                    <!-- Login Form -->
                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small text-muted">Email</label>
                            <input type="email"
                                   class="form-control"
                                   id="email"
                                   placeholder="Enter your email"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted">Password</label>
                            <div class="input-group">
                                <input type="password"
                                       class="form-control"
                                       id="password"
                                       placeholder="Enter your password"
                                       required>
                                <button class="btn btn-outline-secondary"
                                        type="button"
                                        id="togglePassword">
                                    <i class="bi bi-eye" id="eyeIcon"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit"
                                    class="btn btn-primary"
                                    id="loginBtn">
                                Sign in
                            </button>
                        </div>
                    </form>

                    <p class="text-center text-muted small mt-3">
                        Role is assigned by Pradhana
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Utils -->
<script src="../js/utils.js"></script>
<!-- Auth JS -->
<script src="../js/auth.js"></script>

</body>
</html>
