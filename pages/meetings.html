<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meetings | ApartmentManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">
         <i class="bi bi-buildings-fill fs-1 text-primary"></i>
        <h6 class="d-inline ms-2">ApartmentManager</h6>
        <br>
        <small class="text-muted" id="roleLabel">Panel</small>
    </div>
    <nav class="nav flex-column mt-2" id="sidebarNav"></nav>
</div>

<!-- Topbar -->
<div class="topbar">
    <h6 class="page-title">Meetings</h6>
    <div class="user-info">
        <div class="avatar">PR</div>
        <span id="topbarRole">Loading...</span>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <div id="message"></div>

    <!-- Page Header -->
    <div class="page-header d-flex justify-content-between
                align-items-center">
        <div>
            <h5>Meetings</h5>
            <p>Society meetings and announcements</p>
        </div>
        <!-- Create button only for Pradhana -->
        <div id="createBtnContainer"></div>
    </div>

    <!-- Tabs -->
    <ul class="nav nav-tabs mb-3">
        <li class="nav-item">
            <a class="nav-link active"
               id="upcomingTab"
               href="#"
               onclick="showTab('upcoming')">
                <i class="bi bi-calendar-check me-1"></i>
                Upcoming
            </a>
        </li>
        <li class="nav-item">
            <a class="nav-link"
               id="allTab"
               href="#"
               onclick="showTab('all')">
                <i class="bi bi-calendar-event me-1"></i>
                All Meetings
            </a>
        </li>
    </ul>

    <!-- Upcoming Meetings -->
    <div id="upcomingContent">
        <div class="card">
            <div class="card-body p-0">
                <div id="upcomingMeetingsTable">
                    <div class="empty-state">
                        <i class="bi bi-calendar-check
                                  text-muted"></i>
                        <p>Loading upcoming meetings...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- All Meetings -->
    <div id="allContent" style="display:none">
        <div class="card">
            <div class="card-body p-0">
                <div id="allMeetingsTable">
                    <div class="empty-state">
                        <i class="bi bi-calendar-event
                                  text-muted"></i>
                        <p>Loading all meetings...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Create Meeting Modal -->
<div class="modal fade" id="createMeetingModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create Meeting</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <div id="modalMessage"></div>

                <form id="createMeetingForm">
                    <div class="mb-3">
                        <label class="form-label">
                            Meeting Title
                        </label>
                        <input type="text"
                               class="form-control"
                               id="meetingTitle"
                               placeholder="e.g. Monthly Society Meeting">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Agenda
                            <small class="text-muted">
                                (Optional)
                            </small>
                        </label>
                        <textarea class="form-control"
                                  id="meetingAgenda"
                                  rows="3"
                                  placeholder="What will be discussed?"></textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Meeting Date
                            </label>
                            <input type="date"
                                   class="form-control"
                                   id="meetingDate">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">
                                Meeting Time
                            </label>
                            <input type="time"
                                   class="form-control"
                                   id="meetingTime">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Location</label>
                        <input type="text"
                               class="form-control"
                               id="meetingLocation"
                               placeholder="e.g. Terrace - Building A">
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button"
                        class="btn btn-primary"
                        id="createMeetingBtn"
                        onclick="createMeeting()">
                    Create Meeting
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/meeting.js"></script>

</body>
</html>
