<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contributions | ApartmentManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-buildings-fill fs-1 text-primary"></i>
        <h6 class="d-inline ms-2">ApartmentManager</h6>
        <br>
        <small class="text-muted" id="roleLabel">Panel</small>
    </div>
    <nav class="nav flex-column mt-2" id="sidebarNav"></nav>
</div>

<!-- Topbar -->
<div class="topbar">
    <h6 class="page-title">Contributions</h6>
    <div class="user-info">
        <div class="avatar">PR</div>
        <span id="topbarRole">Loading...</span>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <div id="message"></div>

    <!-- Page Header -->
    <div class="page-header d-flex justify-content-between
                align-items-center">
        <div>
            <h5>Extra Contributions</h5>
            <p>Member contributions towards apartment maintenance</p>
        </div>
        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#submitContributionModal">
            <i class="bi bi-plus-lg me-1"></i>
            Submit Contribution
        </button>
    </div>

    <!-- Tabs Container -->
    <div id="tabsContainer"></div>

    <!-- Tab Content -->
    <div id="tabContent"></div>

</div>

<!-- Submit Contribution Modal -->
<div class="modal fade" id="submitContributionModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Submit Contribution</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <div id="modalMessage"></div>

                <form id="submitContributionForm">
                    <div class="mb-3">
                        <label class="form-label">
                            What did you do?
                        </label>
                        <input type="text"
                               class="form-control"
                               id="contributionDescription"
                               placeholder="e.g. Planted 10 saplings in garden">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Amount Spent (₹)
                        </label>
                        <input type="number"
                               class="form-control"
                               id="contributionAmount"
                               placeholder="Enter amount"
                               min="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Contribution Date
                        </label>
                        <input type="date"
                               class="form-control"
                               id="contributionDate">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Proof URL
                            <small class="text-muted">
                                (Optional)
                            </small>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="contributionProofUrl"
                               placeholder="Paste proof image URL">
                    </div>
                </form>

                <!-- Note for Pradhana -->
                <div id="pradhanaNote" style="display:none">
                    <div class="alert alert-info">
                        <i class="bi bi-info-circle me-2"></i>
                        As Pradhana your contribution will be
                        <strong>auto approved</strong> and credit
                        will be added immediately!
                    </div>
                </div>

            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button"
                        class="btn btn-primary"
                        id="submitContributionBtn"
                        onclick="submitContribution()">
                    Submit
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/contribution.js"></script>

</body>
</html>
