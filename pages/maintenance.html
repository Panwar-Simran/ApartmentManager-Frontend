<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance | ApartmentManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Sidebar - changes based on role -->
<div class="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-buildings-fill fs-1 text-primary"></i>
        <h6 class="d-inline ms-2">ApartmentManager</h6>
        <br>
        <small class="text-muted" id="roleLabel">Panel</small>
    </div>
    <nav class="nav flex-column mt-2" id="sidebarNav">
        <!-- Filled by JS based on role -->
    </nav>
</div>

<!-- Topbar -->
<div class="topbar">
    <h6 class="page-title">Maintenance Cycles</h6>
    <div class="user-info">
        <div class="avatar">PR</div>
        <span id="topbarRole">Loading...</span>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <div id="message"></div>

    <!-- Page Header -->
    <div class="page-header d-flex justify-content-between
                align-items-center">
        <div>
            <h5>Maintenance Cycles</h5>
            <p>Monthly maintenance collection cycles</p>
        </div>
        <!-- Create button only for Pradhana -->
        <div id="createBtnContainer"></div>
    </div>

    <!-- Cycles Table -->
    <div class="card">
        <div class="card-body p-0">
            <div id="cyclesTableContainer">
                <div class="empty-state">
                    <i class="bi bi-calendar-check text-muted"></i>
                    <p>Loading cycles...</p>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Create Cycle Modal - Pradhana only -->
<div class="modal fade" id="createCycleModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Create Maintenance Cycle</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <div id="modalMessage"></div>

                <form id="createCycleForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Month</label>
                            <select class="form-select" id="cycleMonth">
                                <option value="">Select Month</option>
                                <option value="1">January</option>
                                <option value="2">February</option>
                                <option value="3">March</option>
                                <option value="4">April</option>
                                <option value="5">May</option>
                                <option value="6">June</option>
                                <option value="7">July</option>
                                <option value="8">August</option>
                                <option value="9">September</option>
                                <option value="10">October</option>
                                <option value="11">November</option>
                                <option value="12">December</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Year</label>
                            <input type="number"
                                   class="form-control"
                                   id="cycleYear"
                                   placeholder="e.g. 2026"
                                   min="2024"
                                   max="2030">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Amount Per Member (₹)
                        </label>
                        <input type="number"
                               class="form-control"
                               id="cycleAmount"
                               placeholder="e.g. 500"
                               min="1">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Due Date</label>
                        <input type="date"
                               class="form-control"
                               id="cycleDueDate">
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button"
                        class="btn btn-primary"
                        id="createCycleBtn"
                        onclick="createCycle()">
                    Create Cycle
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/maintenance.js"></script>

</body>
</html>
