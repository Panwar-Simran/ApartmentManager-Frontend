<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Members | ApartmentManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">
         <i class="bi bi-buildings-fill fs-1 text-primary"></i>
        <h6 class="d-inline ms-2">ApartmentManager</h6>
        <br>
        <small class="text-muted">Pradhana Panel</small>
    </div>
    <nav class="nav flex-column mt-2">
        <a class="nav-link" href="pradhana-dashboard.html">
            <i class="bi bi-layout-dashboard"></i> Dashboard
        </a>
        <a class="nav-link active" href="members.html">
            <i class="bi bi-people"></i> Members
        </a>
        <a class="nav-link" href="maintenance.html">
            <i class="bi bi-calendar-check"></i> Maintenance
        </a>
        <a class="nav-link" href="payments.html">
            <i class="bi bi-cash-stack"></i> Payments
        </a>
        <a class="nav-link" href="expenses.html">
            <i class="bi bi-receipt"></i> Expenses
        </a>
        <a class="nav-link" href="contributions.html">
            <i class="bi bi-heart-pulse"></i> Contributions
        </a>
        <a class="nav-link" href="meetings.html">
            <i class="bi bi-calendar-event"></i> Meetings
        </a>
        <a class="nav-link" href="report.html">
            <i class="bi bi-file-earmark-bar-graph"></i> Reports
        </a>
        <hr class="mx-3">
        <a class="nav-link text-danger" href="#" onclick="logout()">
            <i class="bi bi-box-arrow-left"></i> Logout
        </a>
    </nav>
</div>

<!-- Topbar -->
<div class="topbar">
    <h6 class="page-title">Members</h6>
    <div class="user-info">
        <div class="avatar">PR</div>
        <span>Pradhana</span>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <div id="message"></div>

    <!-- Page Header -->
    <div class="page-header d-flex justify-content-between
                align-items-center">
        <div>
            <h5>Members</h5>
            <p>Manage all apartment members</p>
        </div>
        <button class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#addMemberModal">
            <i class="bi bi-plus-lg me-1"></i> Add Member
        </button>
    </div>

    <!-- Members Table -->
    <div class="card">
        <div class="card-body p-0">
            <div id="membersTableContainer">
                <div class="empty-state">
                    <i class="bi bi-people text-muted"></i>
                    <p>Loading members...</p>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Add Member Modal -->
<div class="modal fade" id="addMemberModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Add New Member</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <div id="modalMessage"></div>

                <form id="addMemberForm">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text"
                               class="form-control"
                               id="memberName"
                               placeholder="Enter full name"
                               required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email"
                               class="form-control"
                               id="memberEmail"
                               placeholder="Enter email"
                               required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text"
                               class="form-control"
                               id="memberPhone"
                               placeholder="10 digit phone number"
                               maxlength="10"
                               required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Flat Number</label>
                        <input type="text"
                               class="form-control"
                               id="memberFlatNumber"
                               placeholder="e.g. A101"
                               required>
                    </div>
                </form>

            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button"
                        class="btn btn-primary"
                        id="addMemberBtn"
                        onclick="addMember()">
                    Add Member
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/member.js"></script>

</body>
</html>
