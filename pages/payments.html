<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments | ApartmentManager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
    <div class="sidebar-brand">
        <i class="bi bi-buildings-fill fs-1 text-primary"></i>
        <h6 class="d-inline ms-2">ApartmentManager</h6>
        <br>
        <small class="text-muted" id="roleLabel">Panel</small>
    </div>
    <nav class="nav flex-column mt-2" id="sidebarNav"></nav>
</div>

<!-- Topbar -->
<div class="topbar">
    <h6 class="page-title">Payments</h6>
    <div class="user-info">
        <div class="avatar">PR</div>
        <span id="topbarRole">Loading...</span>
    </div>
</div>

<!-- Main Content -->
<div class="main-content">

    <div id="message"></div>

    <!-- Page Header -->
    <div class="page-header">
        <h5>Payments</h5>
        <p>Manage maintenance payments</p>
    </div>

    <!-- Tabs - different for each role -->
    <div id="tabsContainer"></div>

    <!-- Tab Content -->
    <div id="tabContent"></div>

</div>

<!-- Upload Payment Modal -->
<div class="modal fade" id="uploadPaymentModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Upload Payment</h5>
                <button type="button" class="btn-close"
                        data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <div id="modalMessage"></div>

                <form id="uploadPaymentForm">

                    <div class="mb-3">
                        <label class="form-label">
                            Select Cycle
                        </label>
                        <select class="form-select"
                                id="paymentCycleId">
                            <option value="">
                                Select maintenance cycle
                            </option>
                        </select>
                    </div>

                    <div id="paymentSummary"></div>

                    <div class="mb-3">
                        <label class="form-label">
                            Payment Mode
                        </label>
                        <select class="form-select"
                                id="paymentMode">
                            <option value="">Select mode</option>
                            <option value="UPI">UPI</option>
                            <option value="CASH">Cash</option>
                            <option value="ONLINE">
                                Online Transfer
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Transaction Reference
                            <small class="text-muted">
                                (Optional for cash)
                            </small>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="transactionRef"
                               placeholder="UPI transaction ID">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Screenshot URL
                            <small class="text-muted">
                                (Optional)
                            </small>
                        </label>
                        <input type="text"
                               class="form-control"
                               id="screenshotUrl"
                               placeholder="Paste screenshot URL">
                    </div>

                </form>

            </div>
            <div class="modal-footer">
                <button type="button"
                        class="btn btn-outline-secondary"
                        data-bs-dismiss="modal">
                    Cancel
                </button>
                <button type="button"
                        class="btn btn-primary"
                        id="uploadPaymentBtn"
                        onclick="uploadPayment()">
                    Upload Payment
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/payment.js"></script>

</body>
</html>
