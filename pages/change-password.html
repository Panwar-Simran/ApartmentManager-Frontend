<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | ApartmentManager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body class="bg-light">

<div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
        <div class="col-md-4">

            <!-- Logo -->
            <div class="text-center mb-4">
                <div class="login-logo mx-auto mb-3">
                      <i class="bi bi-buildings-fill fs-1 text-primary"></i>
                </div>
                <h4 class="fw-bold">ApartmentManager</h4>
            </div>

            <!-- Change Password Card -->
            <div class="card shadow-sm border-0">
                <div class="card-body p-4">

                    <h5 class="card-title mb-1">Change Password</h5>
                    <p class="text-muted small mb-4">
                        Please change your temporary password to continue
                    </p>

                    <!-- Message div -->
                    <div id="message"></div>

                    <!-- Change Password Form -->
                    <form id="changePasswordForm">

                        <div class="mb-3">
                            <label class="form-label small text-muted">
                                Current Password
                            </label>
                            <input type="password"
                                   class="form-control"
                                   id="currentPassword"
                                   placeholder="Enter current password"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted">
                                New Password
                            </label>
                            <input type="password"
                                   class="form-control"
                                   id="newPassword"
                                   placeholder="Enter new password (min 6 chars)"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small text-muted">
                                Confirm New Password
                            </label>
                            <input type="password"
                                   class="form-control"
                                   id="confirmPassword"
                                   placeholder="Confirm new password"
                                   required>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit"
                                    class="btn btn-primary"
                                    id="changeBtn">
                                Change Password
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>

</body>
</html>
